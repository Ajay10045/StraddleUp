services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-straddleup}
      POSTGRES_USER: ${POSTGRES_USER:-straddleup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-straddleup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-straddleup} -d ${POSTGRES_DB:-straddleup}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-straddleup}:${POSTGRES_PASSWORD:-straddleup}@postgres:5432/${POSTGRES_DB:-straddleup}
      REDIS_URL: redis://redis:6379/0
      APP_SECRET: ${APP_SECRET:-change-me-before-sharing}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  redis_data:
